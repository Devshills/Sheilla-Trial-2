<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #172554;
            background: #eff6ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: 24px;
            background: linear-gradient(135deg, #dbeafe, #f8fbff);
        }

        .registration-panel {
            width: min(100%, 440px);
            padding: 36px;
            background: #ffffff;
            border: 2px solid #2563eb;
            border-radius: 8px;
            box-shadow: 0 16px 35px rgba(30, 64, 175, 0.16);
        }

        h1 {
            margin: 0 0 28px;
            color: #1d4ed8;
            font-size: 2rem;
            text-align: center;
        }

        .form-field {
            display: block;
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #1e40af;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid #93c5fd;
            border-radius: 5px;
            color: #1d4ed8;
            background: #f8fbff;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease, box-shadow 160ms ease;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16);
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 13px;
            border: 0;
            border-radius: 5px;
            color: #ffffff;
            background: #2563eb;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 160ms ease, transform 160ms ease;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        @media (max-width: 480px) {
            .registration-panel {
                padding: 28px 22px;
            }
        }
    </style>
</head>
<body>
    <main class="registration-panel">
        <h1>Registration Form</h1>
        <form>
            <div class="form-field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit">Register</button>
        </form>
    </main>
    
</body>
</html>
